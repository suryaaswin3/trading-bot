# TradingView Webhook Reverse Proxy
# Installed at: /etc/nginx/sites-available/tradingview-webhook
# Symlinked to: /etc/nginx/sites-enabled/tradingview-webhook
#
# Proxies TradingView webhook traffic from port 80 → FastAPI on 127.0.0.1:8080
# FastAPI is bound to localhost only — not directly exposed.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;  # deprecated but harmless

    # ── Request size limits ────────────────────────────────────────────────
    # TradingView alerts are small JSON payloads (< 10 KB)
    client_max_body_size 64k;
    client_body_buffer_size 16k;

    # ── Proxy timeouts ─────────────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Buffering ──────────────────────────────────────────────────────────
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 8k;

    # ── Webhook endpoint ───────────────────────────────────────────────────
    location /webhook/tradingview {
        proxy_pass http://127.0.0.1:8080;

        # Preserve original client IP
        proxy_set_header Host                  $host;
        proxy_set_header X-Real-IP             $remote_addr;
        proxy_set_header X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto     $scheme;

        # Do NOT buffer the request body — backend needs the raw body for HMAC
        proxy_request_buffering off;

        # Keep-alive to backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Limit methods allowed (TradingView sends POST only)
        limit_except POST {
            deny all;
        }
    }

    # ── Health check for Nginx itself (optional) ────────────────────────────
    location /nginx/health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Deny all other paths ───────────────────────────────────────────────
    location / {
        deny all;
        return 403;
    }
}
